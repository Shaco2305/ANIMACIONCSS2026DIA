<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARALLAX</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
gap:18px;
background:#050505;
overflow:hidden;
font-family:Arial;
}

.contenedor{
width:1450px;
height:760px;
position:relative;
overflow:hidden;
border:10px solid white;
border-radius:35px;
box-shadow:0 0 45px black;
background:black;
}

.fondo{
width:110%;
height:110%;
position:absolute;
top:-5%;
left:-5%;
background:url(img/fondo.jpg) center center no-repeat;
background-size:cover;
animation:fondoZoom 18s linear forwards;
z-index:1;
}

@keyframes fondoZoom{
from{
transform:scale(1);
}
to{
transform:scale(1.05);
}
}

.cesped{
width:120%;
height:260px;
position:absolute;
left:-10%;
bottom:-20px;
background:url(img/cesped3.jpg) center bottom no-repeat;
background-size:100% 100%;
animation:cespedZoom 10s linear forwards;
z-index:2;
}

@keyframes cespedZoom{
from{
transform:scale(1);
}
to{
transform:scale(1.18);
}
}

.arboles{
width:115%;
height:100%;
position:absolute;
top:0;
left:-7%;
background:url(img/arboles1.png) center bottom no-repeat;
background-size:100%;
animation:arbolZoom 14s linear forwards;
z-index:4;
}

@keyframes arbolZoom{
from{
transform:scale(1);
}
to{
transform:scale(1.10);
}
}

.champi{
width:320px;
height:320px;
position:absolute;
top:360px;
left:-320px;
background:url(img/champi2.png) no-repeat;
background-size:100% 100%;
animation:caminar 10s linear forwards;
z-index:5;
filter:drop-shadow(0 0 12px white);
}

@keyframes caminar{
0%{
left:-320px;
transform:scale(.6);
}
70%{
left:520px;
transform:scale(1);
}
100%{
left:520px;
transform:scale(1.12);
}
}

.shaco{
width:210px;
height:280px;
position:absolute;
top:390px;
left:980px;
background:url(img/shaco.png);
background-size:100% 100%;
z-index:6;
animation:flotar 1.8s infinite alternate ease-in-out;
filter:
drop-shadow(0 0 10px red)
drop-shadow(0 0 25px rgba(255,0,0,.8));
}

@keyframes flotar{
from{
transform:translateY(0px);
}
to{
transform:translateY(-12px);
}
}

.panel{
padding:18px 28px;
border-radius:20px;
background:linear-gradient(135deg,#6a5cff,#8f7dff);
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 0 20px rgba(106,92,255,.7);
}

.panel a{
text-decoration:none;
color:white;
font-size:22px;
font-weight:bold;
transition:.4s;
}

.panel a:hover{
transform:scale(1.08);
color:#ffffff;
text-shadow:0 0 10px white;
}

</style>
</head>

<body>

<div class="contenedor">

<div class="fondo"></div>

<div class="cesped"></div>

<div class="champi"></div>

<div class="arboles"></div>

<div class="shaco"></div>

</div>

<div class="panel">
<a href="index.html">VOLVER</a>
</div>

</body>
</html>
