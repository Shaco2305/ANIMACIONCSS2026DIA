<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMACION PAYASO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
gap:18px;
overflow:hidden;
background:#111;
font-family:Arial;
}

.contenedor{
width:1200px;
height:700px;
position:relative;
overflow:hidden;
border-radius:25px;
border:6px solid white;
box-shadow:0 0 40px black;
background:url(img/parque.jpg) no-repeat center bottom;
background-size:cover;
}

.personaje{
width:350px;
height:450px;
position:absolute;
bottom:130px;
left:-400px;
animation:caminar 12s linear forwards;
z-index:6;
transform:scale(.58);
transform-origin:bottom left;
}

@keyframes caminar{
0%{
left:-400px;
}
70%{
left:18%;
}
100%{
left:18%;
}
}

.gorro{
width:200px;
height:150px;
background:url(img/chinese.webp);
background-size:100% 100%;
clip-path:polygon(50% 0%,0% 100%,100% 100%);
position:absolute;
top:25px;
left:150px;
z-index:2;
}

.cara{
width:200px;
height:200px;
background:url(img/Trollface.webp);
background-size:cover;
background-repeat:no-repeat;
clip-path:circle(50% at 50% 50%);
position:absolute;
top:125px;
left:150px;
}

.cuerpo{
width:200px;
height:200px;
background:url(img/jean.webp);
background-size:cover;
clip-path:polygon(42% 0,68% 0,80% 100%,26% 100%);
position:absolute;
top:320px;
left:140px;
z-index:2;
}

.manos{
width:300px;
height:200px;
background:url(img/polos.avif);
background-size:cover;
clip-path:polygon(19% 48%,84% 47%,100% 61%,84% 70%,17% 71%,0 59%);
position:absolute;
top:280px;
left:100px;
z-index:1;
animation:moverManos .45s infinite alternate;
}

@keyframes moverManos{
from{
transform:rotate(4deg);
}
to{
transform:rotate(-4deg);
}
}

.zapaiz{
width:200px;
height:200px;
background:url(img/zapatos.webp);
background-size:cover;
clip-path:ellipse(23% 12% at 23% 88%);
position:absolute;
top:350px;
left:125px;
z-index:3;
animation:pataIzq .35s infinite alternate;
}

.zapade{
width:200px;
height:200px;
background:url(img/zapatos.webp);
background-size:cover;
clip-path:ellipse(25% 15% at 75% 85%);
position:absolute;
top:365px;
left:175px;
z-index:3;
animation:pataDer .35s infinite alternate;
}

@keyframes pataIzq{
from{
transform:translateY(0px);
}
to{
transform:translateY(-8px);
}
}

@keyframes pataDer{
from{
transform:translateY(-8px);
}
to{
transform:translateY(0px);
}
}

.cono{
width:150px;
height:150px;
background:url(img/cono.webp);
background-size:100% 100%;
clip-path:polygon(49% 51%,32% 0,71% 0);
position:absolute;
top:325px;
left:325px;
z-index:3;
}

.bola{
width:150px;
height:150px;
background:url(img/fresa.jpg);
background-size:cover;
clip-path:circle(16.4% at 50% 50%);
position:absolute;
top:235px;
left:310px;
z-index:2;
animation:caer1 2s forwards;
animation-delay:10s;
}

.bola2{
width:150px;
height:150px;
background:url(img/vainilla.jpg);
background-size:cover;
clip-path:circle(16.4% at 50% 50%);
position:absolute;
top:235px;
left:340px;
z-index:2;
animation:caer2 2s forwards;
animation-delay:10s;
}

.bola3{
width:150px;
height:150px;
background:url(img/chocolate.jpg);
background-size:cover;
clip-path:circle(16.4% at 50% 50%);
position:absolute;
top:205px;
left:325px;
z-index:1;
animation:caer3 2s forwards;
animation-delay:10s;
}

@keyframes caer1{
to{
transform:translateY(280px);
}
}

@keyframes caer2{
to{
transform:translateY(300px);
}
}

@keyframes caer3{
to{
transform:translateY(320px);
}
}

.shaco{
width:190px;
height:240px;
background:url(img/shaco3.png);
background-size:100% 100%;
position:absolute;
right:250px;
bottom:170px;
opacity:0;
animation:aparecerShaco .8s forwards;
animation-delay:9s;
z-index:10;
}

@keyframes aparecerShaco{
0%{
transform:scale(.2);
opacity:0;
}
100%{
transform:scale(1);
opacity:1;
}
}

.panel{
padding:18px 28px;
border-radius:20px;
background:linear-gradient(135deg,#6a5cff,#8f7dff);
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 0 20px rgba(106,92,255,.7);
}

.panel a{
text-decoration:none;
color:white;
font-size:22px;
font-weight:bold;
transition:.4s;
}

.panel a:hover{
transform:scale(1.08);
color:#ffffff;
text-shadow:0 0 10px white;
}

</style>
</head>

<body>

<div class="contenedor">

<div class="personaje">
<div class="gorro"></div>
<div class="cara"></div>
<div class="cuerpo"></div>
<div class="zapaiz"></div>
<div class="zapade"></div>
<div class="manos"></div>
<div class="cono"></div>
<div class="bola"></div>
<div class="bola2"></div>
<div class="bola3"></div>
</div>

<div class="shaco"></div>

</div>

<div class="panel">
<a href="../index.html">VOLVER</a>
</div>

</body>
</html>
