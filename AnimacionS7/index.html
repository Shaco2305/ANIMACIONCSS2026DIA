<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARALLAX</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.contenedor{
width:1350px;
height:760px;
position:relative;
overflow:hidden;
border:8px solid white;
border-radius:30px;
box-shadow:0 0 40px black;
background:black;
}

.fondo{
width:110%;
height:110%;
position:absolute;
top:-5%;
left:-5%;
background:url(img/fondo.jpg) center center no-repeat;
background-size:cover;
animation:zoomFondo 30s linear forwards;
filter:brightness(.9);
z-index:1;
}

@keyframes zoomFondo{
from{
transform:scale(1);
}
to{
transform:scale(1.08);
}
}

.cesped{
width:130%;
height:340px;
position:absolute;
left:-15%;
bottom:-30px;
background:url(img/cesped3.jpg) center bottom no-repeat;
background-size:100% 100%;
animation:zoomCesped 12s linear forwards;
z-index:2;
opacity:.95;
}

@keyframes zoomCesped{
from{
transform:scale(1);
}
to{
transform:scale(1.28);
}
}

.arboles{
width:120%;
height:100%;
position:absolute;
left:-10%;
bottom:0;
background:url(img/arboles1.png) center bottom no-repeat;
background-size:80%;
animation:zoomArboles 18s linear forwards;
z-index:4;
}

@keyframes zoomArboles{
from{
transform:scale(1);
}
to{
transform:scale(1.16);
}
}

.personaje{
width:350px;
height:450px;
position:absolute;
bottom:85px;
left:-400px;
animation:caminar 12s linear forwards;
z-index:6;
transform:scale(.58);
transform-origin:bottom left;
}

@keyframes caminar{
0%{
left:-400px;
}
70%{
left:20%;
}
100%{
left:20%;
}
}

.gorro{
width:200px;
height:150px;
background-image:url(img/chinese.webp);
background-size:100% 100%;
clip-path:polygon(50% 0%,0% 100%,100% 100%);
position:absolute;
top:25px;
left:150px;
z-index:2;
}

.cara{
width:200px;
height:200px;
background-image:url(img/Trollface.webp);
background-size:cover;
background-repeat:no-repeat;
clip-path:circle(50% at 50% 50%);
position:absolute;
top:125px;
left:150px;
}

.cuerpo{
width:200px;
height:200px;
background-image:url(img/jean.webp);
background-size:cover;
clip-path:polygon(42% 0,68% 0,80% 100%,26% 100%);
position:absolute;
top:320px;
left:140px;
z-index:2;
}

.manos{
width:300px;
height:200px;
background-image:url(img/polos.avif);
background-size:cover;
clip-path:polygon(19% 48%,84% 47%,100% 61%,84% 70%,17% 71%,0 59%);
position:absolute;
top:280px;
left:100px;
z-index:1;
animation:moverManos .45s infinite alternate;
}

@keyframes moverManos{
from{
transform:rotate(4deg);
}
to{
transform:rotate(-4deg);
}
}

.zapaiz{
width:200px;
height:200px;
background-image:url(img/zapatos.webp);
background-size:cover;
clip-path:ellipse(23% 12% at 23% 88%);
position:absolute;
top:350px;
left:125px;
z-index:3;
animation:pataIzq .35s infinite alternate;
}

.zapade{
width:200px;
height:200px;
background-image:url(img/zapatos.webp);
background-size:cover;
clip-path:ellipse(25% 15% at 75% 85%);
position:absolute;
top:365px;
left:175px;
z-index:3;
animation:pataDer .35s infinite alternate;
}

@keyframes pataIzq{
from{
transform:translateY(0px);
}
to{
transform:translateY(-8px);
}
}

@keyframes pataDer{
from{
transform:translateY(-8px);
}
to{
transform:translateY(0px);
}
}

.cono{
width:150px;
height:150px;
background-image:url(img/cono.webp);
background-size:100% 100%;
clip-path:polygon(49% 51%,32% 0,71% 0);
position:absolute;
top:325px;
left:325px;
z-index:3;
}

.bola{
width:150px;
height:150px;
background-image:url(img/fresa.jpg);
background-size:cover;
clip-path:circle(16.4% at 50% 50%);
position:absolute;
top:235px;
left:310px;
z-index:2;
animation:caer1 2s forwards;
animation-delay:10s;
}

.bola2{
width:150px;
height:150px;
background-image:url(img/vainilla.jpg);
background-size:cover;
clip-path:circle(16.4% at 50% 50%);
position:absolute;
top:235px;
left:340px;
z-index:2;
animation:caer2 2s forwards;
animation-delay:10s;
}

.bola3{
width:150px;
height:150px;
background-image:url(img/chocolate.jpg);
background-size:cover;
clip-path:circle(16.4% at 50% 50%);
position:absolute;
top:205px;
left:325px;
z-index:1;
animation:caer3 2s forwards;
animation-delay:10s;
}

@keyframes caer1{
to{
transform:translateY(280px);
}
}

@keyframes caer2{
to{
transform:translateY(300px);
}
}

@keyframes caer3{
to{
transform:translateY(320px);
}
}

.shaco{
width:190px;
height:240px;
background:url(img/shaco.png);
background-size:100% 100%;
position:absolute;
right:320px;
bottom:120px;
opacity:0;
animation:aparecerShaco .8s forwards;
animation-delay:9s;
z-index:10;
}

@keyframes aparecerShaco{
0%{
transform:scale(.2);
opacity:0;
}
100%{
transform:scale(1);
opacity:1;
}
}

</style>
</head>

<body>
<br><br><a href="/ANIMACIONCSS2026DIA/index.html">VOLVER</a><br><br>
<div class="contenedor">

<div class="fondo"></div>
<div class="cesped"></div>
<div class="arboles"></div>

<div class="personaje">
<div class="gorro"></div>
<div class="cara"></div>
<div class="cuerpo"></div>
<div class="zapaiz"></div>
<div class="zapade"></div>
<div class="manos"></div>
<div class="cono"></div>
<div class="bola"></div>
<div class="bola2"></div>
<div class="bola3"></div>
</div>

<div class="shaco"></div>

</div>

</body>
</html>
