<html>
    <head>
        <title></title>
        <style>
            *{
                margin: 0px;
                padding: 0px;
            }
            .contenedor{
                width: 800px;
                height: 300px;
                border: 1px solid black ;
                margin: 0 auto;
                position: relative;
                overflow: hidden;
            }
            .cuadrito{  
                width: 100px;
                height: 100px;

                position: absolute;
                top: 0px;
                left: 0 px;
                animation: cuadrito 4s infinite;

            }
            .abeja{
                width: 100%;
                rotate: 45deg;
               
            }

            @keyframes cuadrito {
            0%{
                top: 100px;
                left: 700px;
                rotate: -45deg;
            }
            33%{
                top: 0px;
                left: 500px;
                rotate: 0deg;
            }
            66%{
                top: 200px;
                left: 250px;
                rotate: -45deg;
            }
            100%{
                top: 0px;
                left: -100px;
                rotate: 0deg;
            }
        }
            .pradera{
                position: absolute;
                bottom: 0px;
                left: 0px;
                width: 100%;
                z-index: -2;
            }

            .cielo{
                position: absolute;
                top: 0px;
                left: 0px;
                width: 100%;
                height: 100%;
                z-index: -1;
            }

            .cuadrito2{  
                width: 100px;
                height: 100px;
                position: absolute;
                top: 0px;
                left: -100px;
                animation: cuadrito 5s infinite 2s;
            }
             .abeja2{
                position: absolute;
                width: 80%;
                left: 100px;
                z-index: 0;
               
            }

            @keyframes cuadrito2 {
                0%{
                    top: 100px;
                    left: -100px;
                }
                100%{
                    top: 0px;
                    left: 800px;
                }
            }   
        </style>
    </head>
    <body>
        <br><br><a href="../../index.html">VOLVER</a><br><br>

        <div class="contenedor">
            
            <div class="cuadrito"> 
                <img class="abeja" src="/AnimacionS4/Animacion por pasos/img/abeja2.webp" alt="">
            </div>
                
            <img class="cielo" src="/AnimacionS4/Animacion por pasos/img/cielo.png" alt="">
            <img class="pradera" src="/AnimacionS4/Animacion por pasos/img/pradera.jpg" alt="">
            
         <div class="cuadrito2">
                <img class="abeja2" src="/AnimacionS4/Animacion por pasos/img/abeja.webp" alt="">
        </div>
        </div>
       
    </body>
</html>
