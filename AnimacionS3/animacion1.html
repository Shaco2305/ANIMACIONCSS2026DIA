<html>

<head>
<title>Animacion 3 CSS</title>

<style>

*{
padding:0px;
margin:0px;
box-sizing:border-box;
}

body{
background:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
url(img/fondo.jpg);
background-size:cover;
background-position:center;
font-family:"Century Gothic";
min-height:100vh;
padding:40px;
overflow:hidden;
}

#principal{
width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:60px;
}

#contenido{
flex:1;
display:flex;
justify-content:center;
padding-top:60px;
}

.contenedor{
width:450px;
height:420px;
border:4px solid white;
position:relative;
overflow:hidden;
background:white;
box-shadow:0 0 25px black;
}

.cuadrito{
width:100px;
height:100px;
background:red;
position:absolute;
top:160px;
left:150px;
animation:cuadrito 3s infinite linear;
}

@keyframes cuadrito{
from{
left:-150px;
}

to{
left:450px;
}
}

#lado{
width:300px;
height:520px;
background:rgba(30,30,30,.95);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:40px;
box-shadow:0 0 30px black;
}

#imagen{
width:230px;
height:230px;
background:url(img/imagen1.jpg);
background-size:cover;
background-position:center;
border:6px solid white;
box-shadow:0 0 25px rgba(255,255,255,.6);
animation:flotar 2s infinite alternate;
}

@keyframes flotar{
from{
transform:translateY(0px);
}

to{
transform:translateY(-12px);
}
}

.panel{
padding:18px 45px;
background:linear-gradient(135deg,#6a5cff,#8f7dff);
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 0 20px rgba(106,92,255,.7);
transition:.4s;
}

.panel:hover{
transform:scale(1.08);
}

.panel a{
text-decoration:none;
color:white;
font-size:24px;
font-weight:bold;
letter-spacing:1px;
text-shadow:0 0 10px white;
}

</style>

</head>

<body>

<div id="principal">

<div id="contenido">

<div class="contenedor">

<div class="cuadrito"></div>

</div>

</div>

<div id="lado">

<div id="imagen"></div>

<div class="panel">
<a href="../index.html">VOLVER</a>
</div>

</div>

</div>

</body>

</html>
