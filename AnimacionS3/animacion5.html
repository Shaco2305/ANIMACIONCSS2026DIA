<html>

<head>
<title>Animacion 3 CSS</title>

<style>

*{
padding:0px;
margin:0px;
box-sizing:border-box;
}

body{
background:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
url(img/fondo.jpg);
background-size:cover;
background-position:center;
font-family:"Century Gothic";
min-height:100vh;
padding:40px;
overflow:hidden;
}

#principal{
width:1250px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:60px;
}

#contenido{
flex:1;
display:flex;
justify-content:center;
padding-top:60px;
}

.contenedor{
width:520px;
height:420px;
border:4px solid white;
background:black;
position:relative;
overflow:hidden;
box-shadow:0 0 25px black;
}

.cuadrito{
width:100px;
height:100px;
background:transparent;
position:absolute;
left:320px;
top:150px;
animation:mover 4s infinite linear;
}

@keyframes mover{
from{
left:520px;
}

to{
left:-120px;
}
}

.cuadrito img{
width:120px;
height:120px;
transform:scaleX(-1);
}

.cuadrito2,
.cuadrito3,
.cuadrito4,
.cuadrito5,
.cuadrito6,
.cuadrito7{
width:3px;
height:3px;
background:white;
position:absolute;
animation:fly 3s infinite linear;
box-shadow:0 0 10px white;
}

.cuadrito2{
top:60px;
animation-duration:4s;
}

.cuadrito3{
top:130px;
animation-duration:2s;
}

.cuadrito4{
top:90px;
animation-duration:1s;
}

.cuadrito5{
top:40px;
animation-duration:3s;
}

.cuadrito6{
top:190px;
animation-duration:2.5s;
}

.cuadrito7{
top:250px;
animation-duration:1.5s;
}

@keyframes fly{
from{
left:-20px;
}

to{
left:560px;
}
}

#lado{
width:300px;
height:520px;
background:rgba(30,30,30,.95);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:40px;
box-shadow:0 0 30px black;
}

#imagen{
width:230px;
height:230px;
background:url(img/imagen5.jpg);
background-size:cover;
background-position:center;
border:6px solid white;
box-shadow:0 0 25px rgba(255,255,255,.6);
animation:flotar 2s infinite alternate;
}

@keyframes flotar{
from{
transform:translateY(0px);
}

to{
transform:translateY(-12px);
}
}

.panel{
padding:18px 45px;
background:linear-gradient(135deg,#6a5cff,#8f7dff);
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 0 20px rgba(106,92,255,.7);
transition:.4s;
}

.panel:hover{
transform:scale(1.08);
}

.panel a{
text-decoration:none;
color:white;
font-size:24px;
font-weight:bold;
letter-spacing:1px;
text-shadow:0 0 10px white;
}

</style>

</head>

<body>

<div id="principal">

<div id="contenido">

<div class="contenedor">

<div class="cuadrito">
<img src="img/fly.gif">
</div>

<div class="cuadrito2"></div>
<div class="cuadrito3"></div>
<div class="cuadrito4"></div>
<div class="cuadrito5"></div>
<div class="cuadrito6"></div>
<div class="cuadrito7"></div>

</div>

</div>

<div id="lado">

<div id="imagen"></div>

<div class="panel">
<a href="../index.html">VOLVER</a>
</div>

</div>

</div>

</body>

</html>
