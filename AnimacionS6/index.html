<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>DISEÑO WEB</title>

<style>

*{
margin:0px;
padding:0px;
box-sizing:border-box;
}

body{
background:url(img/fondo.jpg);
background-size:cover;
background-position:center;
background-attachment:fixed;
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
padding:40px;
overflow-x:hidden;
}

#principal{
width:1400px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:40px;
}

#lado{
width:300px;
height:700px;
background:#1b1b1b;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:35px;
box-shadow:0 0 30px black;
position:sticky;
top:20px;
}

#imagen{
width:240px;
height:240px;
background:url(img/imagen8.jpg);
background-size:cover;
background-position:center;
border:6px solid white;
box-shadow:0 0 15px white;
animation:flotar 2s infinite alternate;
}

@keyframes flotar{
from{
transform:translateY(0px);
}
to{
transform:translateY(-12px);
}
}

.panel{
padding:18px 45px;
background:linear-gradient(135deg,#6a5cff,#8f7dff);
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 0 15px #6a5cff;
transition:.4s;
}

.panel:hover{
transform:scale(1.05);
}

.panel a{
text-decoration:none;
color:white;
font-size:25px;
font-weight:bold;
letter-spacing:1px;
text-shadow:0 0 10px white;
}

.contenedor{
width:1000px;
height:320px;
position:relative;
background:black;
overflow:hidden;
border:5px solid white;
box-shadow:0 0 20px black;
padding-top:5px;
}

.titulo{
position:absolute;
width:100%;
text-align:center;
color:white;
font-size:38px;
font-weight:bold;
top:50%;
left:0;
transform:translateY(-50%);
text-shadow:0px 0px 10px cyan;
z-index:20;
}

.marco1,.marco2,.marco3,.marco4,.marco5{
width:200px;
height:300px;
position:absolute;
top:5px;
overflow:hidden;
}

.marco1 img,
.marco2 img,
.marco3 img,
.marco4 img,
.marco5 img{
width:100%;
height:100%;
object-fit:cover;
}

.marco1{
left:0px;
border:4px solid #00ffe1;
box-shadow:0 0 10px #00ffe1;
animation:entrada1 6s infinite;
}

.marco2{
left:200px;
border:4px solid #ff00f2;
box-shadow:0 0 10px #ff00f2;
animation:entrada2 6s infinite;
}

.marco3{
left:400px;
border:4px solid #ffe600;
box-shadow:0 0 10px #ffe600;
animation:entrada3 6s infinite;
}

.marco4{
left:600px;
border:4px solid #00ff59;
box-shadow:0 0 10px #00ff59;
animation:entrada4 6s infinite;
}

.marco5{
left:800px;
border:4px solid #ff7300;
box-shadow:0 0 10px #ff7300;
animation:entrada5 6s infinite;
}

@keyframes entrada1{
0%{
top:-320px;
}
60%{
top:5px;
}
100%{
top:5px;
}
}

@keyframes entrada2{
0%{
top:320px;
}
60%{
top:5px;
}
100%{
top:5px;
}
}

@keyframes entrada3{
0%{
left:-250px;
}
60%{
left:400px;
}
100%{
left:400px;
}
}

@keyframes entrada4{
0%{
left:1200px;
}
60%{
left:600px;
}
100%{
left:600px;
}
}

@keyframes entrada5{
0%{
transform:scale(0);
}
60%{
transform:scale(1);
}
100%{
transform:scale(1);
}
}

</style>
</head>

<body>

<div id="principal">

<div class="contenedor">

<div class="marco1">
<img src="/AnimacionS6/img/html.jpg">
</div>

<div class="marco2">
<img src="/AnimacionS6/img/css.jpg">
</div>

<div class="marco3">
<img src="/AnimacionS6/img/javascript.jpg">
</div>

<div class="marco4">
<img src="/AnimacionS6/img/php.jpg">
</div>

<div class="marco5">
<img src="/AnimacionS6/img/bootstrap.jpg">
</div>

<div class="titulo">
Tecnologías de Desarrollo Web
</div>

</div>

<div id="lado">

<div id="imagen"></div>

<div class="panel">
<a href="../../index.html">VOLVER</a>
</div>

</div>

</div>

</body>
</html>
