<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>DISEÑO WEB</title>

<style>
*{
margin:0px;
padding:0px;
box-sizing:border-box;
}

body{
background:#f2f2f2;
font-family:Arial,Helvetica,sans-serif;
}

.contenedor{
width:1000px;
height:300px;
position:relative;
margin:50px auto;
border:2px solid black;
background-color:black;
overflow:hidden;
}

.marco1,.marco2,.marco3,.marco4,.marco5{
width:200px;
height:300px;
position:absolute;
overflow:hidden;
border:2px solid rgb(5,255,213);
box-shadow:0px 0px 20px rgb(5,255,213);
}

.marco1 img,.marco2 img,.marco3 img,.marco4 img,.marco5 img{
width:100%;
height:100%;
object-fit:cover;
}

.marco1{
left:0px;
animation:marco1 5s infinite;
}

@keyframes marco1{
0%{
top:-600px;
left:-200px;
}
50%{
top:0px;
left:-200px;
}
100%{
top:0px;
left:0px;
}
}

.marco2{
left:200px;
animation:marco2 5s infinite;
animation-delay:0.3s;
}

@keyframes marco2{
0%{
top:-600px;
left:0px;
}
50%{
top:0px;
left:0px;
}
100%{
top:0px;
left:200px;
}
}

.marco3{
left:400px;
animation:marco3 5s infinite;
animation-delay:0.6s;
}

@keyframes marco3{
0%{
top:-600px;
left:0px;
}
50%{
top:0px;
left:0px;
}
100%{
top:0px;
left:400px;
}
}

.marco4{
left:600px;
animation:marco4 5s infinite;
animation-delay:0.9s;
}

@keyframes marco4{
0%{
top:-600px;
left:0px;
}
50%{
top:0px;
left:0px;
}
100%{
top:0px;
left:600px;
}
}

.marco5{
left:800px;
animation:marco5 5s infinite;
animation-delay:1.2s;
}

@keyframes marco5{
0%{
top:-600px;
left:0px;
}
50%{
top:0px;
left:0px;
}
100%{
top:0px;
left:800px;
}
}

.titulo{
position:absolute;
width:100%;
text-align:center;
color:white;
font-size:35px;
font-weight:bold;
top:50%;
transform:translateY(-50%);
text-shadow:2px 2px 5px rgb(162,0,255);
}
</style>
</head>

<body>
<br><br><a href="/ANIMACIONCSS2026DIA/index.html">VOLVER</a><br><br>

<div class="contenedor">

<div class="marco1">
<img src="img/html.jpg">
</div>

<div class="marco2">
<img src="img/css.jpg">
</div>

<div class="marco3">
<img src="img/javascript.jpg">
</div>

<div class="marco4">
<img src="img/php.jpg">
</div>

<div class="marco5">
<img src="img/bootstrap.jpg">
</div>

<div class="titulo">
Tecnologías de Desarrollo Web
</div>

</div>

</body>
</html>
